        html { scroll-behavior: smooth; }

        ::selection { background: #000; color: #efefef; }
        :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

        .wordmark { font-weight: 800; font-stretch: 100%; letter-spacing: -0.045em; line-height: 0.86; font-size: clamp(3rem, 12.5vw, 10.5rem); text-transform: uppercase; }
        .wm-line { display: block; overflow: hidden; padding-bottom: 0.05em; }
        .wm-ch { display: inline-block; transform: translateY(105%); animation: rise 0.9s cubic-bezier(.2, .8, .2, 1) forwards; animation-delay: calc(var(--i) * 45ms + 150ms); }
        .ln { opacity: 0; animation: lineIn 0.5s ease-out forwards; animation-delay: var(--d, 0ms); }

        .dots { background-image: radial-gradient(#202020 1px, transparent 1px); background-size: 20px 20px; }
        .scan { position: relative; }
        .scan::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px); }

        .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.8s steps(1) infinite; }
        .led { animation: blink 1.6s steps(1) infinite; }
        .flow { stroke-dasharray: 4 8; animation: dash 1.1s linear infinite; }
        .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 4.5s ease-in-out infinite; }

        .mail { background: linear-gradient(currentColor, currentColor) left bottom / 0 4px no-repeat; transition: background-size 0.45s cubic-bezier(.2, .8, .2, 1); padding-bottom: 0.12em; }
        .mail:hover, .mail:focus-visible { background-size: 100% 4px; }

        .game-canvas { background-image: radial-gradient(#2a2a2a 1px, transparent 1px); background-size: 20px 20px; }
        .fade-in { animation: fadeIn 0.18s ease-out; }
        .panel-in { animation: panelIn 0.28s cubic-bezier(.2, .8, .2, 1); }
        .bug-pop { animation: popIn 0.18s ease-out; }

        @keyframes rise { to { transform: none; } }
        @keyframes lineIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        @keyframes blink { 50% { opacity: 0.25; } }
        @keyframes dash { to { stroke-dashoffset: -24; } }
        @keyframes draw { 0% { stroke-dashoffset: 1; } 55%, 100% { stroke-dashoffset: 0; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes panelIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
        @keyframes popIn { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .wm-ch { transform: none; }
            .ln { opacity: 1; }
            .draw { stroke-dashoffset: 0; }
        }
    </style>
</head>

        function useClock() {
            const fmt = useRef(new Intl.DateTimeFormat('es-ES', { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit', second: '2-digit' }));
            const [t, setT] = useState(() => fmt.current.format(new Date()));
            useEffect(() => {
                const id = setInterval(() => setT(fmt.current.format(new Date())), 1000);
                return () => clearInterval(id);
            }, []);
            return t;
        }

        function useActive(ids) {
            const [active, setActive] = useState('');
            useEffect(() => {
                const io = new IntersectionObserver((es) => {
                    es.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
                }, { rootMargin: '-40% 0px -55% 0px' });
                ids.forEach((id) => { const el = document.getElementById(id); if (el) io.observe(el); });
                return () => io.disconnect();
            }, []);
            return active;
        }

        function Dialog({ open, onClose, label, focusKey, className = '', children }) {
            const ref = useRef(null);
            const closeRef = useRef(onClose);
            closeRef.current = onClose;

            useEffect(() => {
                if (!open) return;
                const prev = document.activeElement;
                document.body.style.overflow = 'hidden';
                const onKey = (e) => {
                    if (e.key === 'Escape') { closeRef.current(); return; }
                    if (e.key !== 'Tab' || !ref.current) return;
                    const f = ref.current.querySelectorAll('a[href], button:not([disabled])');
                    if (!f.length) { e.preventDefault(); return; }
                    const first = f[0], last = f[f.length - 1], cur = document.activeElement;
                    if (e.shiftKey && (cur === first || cur === ref.current)) { e.preventDefault(); last.focus(); }
                    else if (!e.shiftKey && cur === last) { e.preventDefault(); first.focus(); }
                };
                document.addEventListener('keydown', onKey);
                return () => {
                    document.removeEventListener('keydown', onKey);
                    document.body.style.overflow = '';
                    if (prev && prev.focus) prev.focus();
                };
            }, [open]);

            useEffect(() => {
                if (open && ref.current) ref.current.focus();
            }, [open, focusKey]);

            if (!open) return null;
            return (
                <div role="dialog" aria-modal="true" aria-label={label} className="fixed inset-0 z-[100] flex items-center justify-center p-4 fade-in">
                    <div className="absolute inset-0 bg-black/80" onClick={onClose} />
                    <div ref={ref} tabIndex={-1} className={`relative outline-none max-h-[92vh] overflow-auto panel-in ${className}`}>
                        {children}
                    </div>
                </div>
            );
        }

                                <Screen Art={p.Art} />
                                <div className="px-4 py-4 border-t border-neutral-800">
                                    <h3 className="font-semibold text-lg leading-snug">{p.title}</h3>
                                    <p className="mt-1 text-sm text-neutral-500">{p.tags.join(', ')}</p>
                                </div>
                            </button>
                        </li>
                    ))}
                </ul>
            );
        }

        function ProjectViewer({ index, onClose }) {
            const p = PROJECTS[index == null ? 0 : index];
            return (
                <Dialog open={index != null} onClose={onClose} label={p.title} className="bg-black text-white w-[min(62rem,94vw)] border border-neutral-700">
                    <div className="grid md:grid-cols-[1.35fr_1fr]">
                        <div className="border-b md:border-b-0 md:border-r border-neutral-800">
                            <MonitorBar id={`NOC-0${(index == null ? 0 : index) + 1}`} />
                            <Screen Art={p.Art} />
                        </div>
                        <div className="p-6 md:p-8 flex flex-col">
                            <div className="flex items-start justify-between gap-4">
                                <h3 className="text-2xl font-bold leading-tight" style={H}>{p.title}</h3>
                                <button onClick={onClose} aria-label="Cerrar" className="h-9 w-9 shrink-0 grid place-items-center border border-neutral-600 hover:bg-white hover:text-black transition-colors"><i className="bi bi-x-lg" /></button>
                            </div>
                            <p className="mt-4 text-neutral-300 leading-relaxed">{p.text}</p>
                            <ul className="mt-6 flex flex-wrap gap-2">
                                {p.tags.map((t) => <li key={t} className="font-mono text-xs border border-neutral-600 px-2.5 py-1">{t}</li>)}
                            </ul>
                            {p.repo && (
                                <a href={`${LINKS.github}/${p.repo}`} target="_blank" rel="noopener noreferrer" className="mt-auto pt-8 inline-flex items-center gap-2 text-sm underline underline-offset-4 hover:text-neutral-300">
                                    <i className="bi bi-github" /> Ver repositorio
                                </a>
                            )}
                        </div>
                    </div>
                </Dialog>
            );
        }

        function Repos() {
            return (
                <div>
                    <ul className="border-t border-black">
                        {REPOS.map((r) => (
                            <li key={r.name} className="border-b border-line">
                                <a href={`${LINKS.github}/${r.name}`} target="_blank" rel="noopener noreferrer" className="group grid md:grid-cols-[minmax(0,260px)_1fr_auto] gap-x-10 gap-y-1 items-baseline py-7 px-3 -mx-3 transition-colors duration-200 hover:bg-black hover:text-paper">
                                    <h3 className="text-2xl font-bold" style={H}>{r.name}</h3>
                                    <p className="text-steel group-hover:text-neutral-300 max-w-xl transition-colors">{r.text}</p>
                                    <span className="font-mono text-sm">{r.lang}</span>
                                </a>
                            </li>
                        ))}
                    </ul>
                    <a href={LINKS.github} target="_blank" rel="noopener noreferrer" className="mt-8 inline-flex items-center gap-2 text-sm underline underline-offset-4">
                        <i className="bi bi-github" /> Ver todos en github.com/bagpotato
                    </a>
                </div>
            );
        }

        function Meter({ n, total }) {
            return (
                <span className="flex gap-1" role="img" aria-label={`${LEVEL[n]}`}>
                    {Array.from({ length: total }, (_, i) => <span key={i} className={`h-2 w-6 ${i < n ? 'bg-black' : 'bg-line'}`} />)}
                </span>
            );
        }

        function Skills() {
            return (
                <ul className="grid md:grid-cols-2 md:gap-x-16 border-t border-black">
                    {SKILLS.map(([name, lvl]) => (
                        <li key={name} className="flex items-center justify-between gap-6 py-5 border-b border-black/20">
                            <span className="font-semibold text-lg">{name}</span>
                            <span className="flex items-center gap-4">
                                <span className="text-sm text-steel">{LEVEL[lvl]}</span>
                                <Meter n={lvl} total={3} />
                            </span>
                        </li>
                    ))}
                </ul>
            );
        }

        function Education() {
            return (
                <ol className="relative max-w-3xl border-l border-black ml-2">
                    {EDU.map((e) => (
                        <li key={e.title} className="relative pl-10 pb-12 last:pb-0">
                            <span className={`absolute -left-[8px] top-2 h-3.5 w-3.5 rounded-full border border-black ${e.now ? 'bg-black' : 'bg-paper'}`} />
                            <h3 className="text-2xl font-bold leading-snug" style={H}>{e.title}</h3>
                            <p className="mt-1 text-steel">{e.place}, {e.meta}</p>
                            {e.now && <span className="inline-block mt-3 bg-black text-paper font-mono text-xs px-2.5 py-1">en curso</span>}
                        </li>
                    ))}
                </ol>
            );
        }

        function Languages() {
            return (
                <ul className="max-w-3xl border-t border-black">
                    {LANGS.map(([name, level, k]) => (
                        <li key={name} className="py-6 border-b border-black/20">
                            <div className="flex items-baseline justify-between">
                                <span className="text-2xl font-bold" style={H}>{name}</span>
                                <span className="font-mono">{level}</span>
                            </div>
                            <div className="mt-4 flex gap-1" role="img" aria-label={`${name}: ${level}`}>
                                {CEFR.map((c, i) => (
                                    <div key={c} className="flex-1">
                                        <div className={`h-2 ${i < k ? 'bg-black' : 'bg-line'}`} />
                                        <p className="mt-1.5 font-mono text-[11px] text-steel">{c}</p>
                                    </div>
                                ))}
                            </div>
                        </li>
                    ))}
                </ul>
            );
        }

        function Faq() {
            const [open, setOpen] = useState(0);
            return (
                <ul className="max-w-3xl border-t border-black">
                    {FAQ.map(([q, a], i) => {
                        const o = open === i;
                        return (
                            <li key={q} className="border-b border-black/20">
                                <h3>
                                    <button onClick={() => setOpen(o ? -1 : i)} aria-expanded={o} className="w-full flex items-center justify-between gap-6 py-6 text-left text-xl font-semibold">
                                        <span>{q}</span>
                                        <i className={`bi bi-plus-lg shrink-0 transition-transform duration-300 ${o ? 'rotate-45' : ''}`} />
                                    </button>
                                </h3>
                                <div className={`grid transition-[grid-template-rows] duration-300 ${o ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'}`}>
                                    <div className="overflow-hidden">
                                        <p className="pb-6 text-steel max-w-xl">{a}</p>
                                    </div>
                                </div>
                            </li>
                        );
                    })}
                </ul>
            );
        }

        function Contact() {
            const [copied, setCopied] = useState(false);
            const copy = async () => {
                try {
                    await navigator.clipboard.writeText(LINKS.mail);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 1800);
                } catch (e) {
                    window.location.href = 'mailto:' + LINKS.mail;
                }
            };
            return (
                <div>
                    <a href={`mailto:${LINKS.mail}`} className="mail block font-bold leading-[1.05] tracking-tight break-all" style={{ ...H, fontSize: 'clamp(1.5rem, 5.4vw, 4.75rem)' }}>{LINKS.mail}</a>
                    <div className="mt-10 flex flex-wrap gap-3">
                        <button onClick={copy} className="flex items-center gap-2 border border-white px-5 py-3 text-sm hover:bg-white hover:text-black transition-colors">
                            <i className={`bi ${copied ? 'bi-check-lg' : 'bi-clipboard'}`} /> {copied ? 'Correo copiado' : 'Copiar correo'}
                        </button>
                        <a href={LINKS.github} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 border border-white px-5 py-3 text-sm hover:bg-white hover:text-black transition-colors"><i className="bi bi-github" /> GitHub</a>
                        <a href={LINKS.linkedin} target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 border border-white px-5 py-3 text-sm hover:bg-white hover:text-black transition-colors"><i className="bi bi-linkedin" /> LinkedIn</a>
                    </div>
                </div>
            );
        }

        function Footer() {
            return (
                <footer className="bg-black text-neutral-500 border-t border-neutral-800 text-sm">
                    <div className="mx-auto max-w-[1280px] px-6 md:px-10 py-8 flex flex-col sm:flex-row justify-between gap-3">
                        <p>© {new Date().getFullYear()} Juan David Morales Mendoza</p>
                        <p className="flex items-center gap-6">
                            <span>Barcelona</span>
                            <a href="#inicio" className="text-neutral-300 hover:text-white underline underline-offset-4">Volver arriba</a>
                        </p>
                    </div>
                </footer>
            );
        }

        function Game({ open, onClose }) {
            const TOTAL = 15;
            const [state, setState] = useState('idle');
            const [score, setScore] = useState(0);
            const [time, setTime] = useState(TOTAL);
            const [high, setHigh] = useState(0);
            const [pos, setPos] = useState({ x: 50, y: 50 });

            const move = () => setPos({ x: 9 + Math.random() * 82, y: 14 + Math.random() * 72 });
            const start = () => { setScore(0); setTime(TOTAL); move(); setState('playing'); };

            useEffect(() => {
                setState('idle'); setScore(0); setTime(TOTAL);
            }, [open]);

            useEffect(() => {
                if (state !== 'playing') return;
                const id = setInterval(() => setTime((t) => t - 1), 1000);
                return () => clearInterval(id);
            }, [state]);

            useEffect(() => {
                if (state === 'playing' && time <= 0) {
                    setState('over');
                    setHigh((h) => Math.max(h, score));
                }
            }, [time, state, score]);

            return (
                <Dialog open={open} onClose={onClose} label="Bug Hunter" focusKey={state} className="bg-black text-white w-[min(32rem,92vw)] border border-neutral-700">
                    <header className="flex items-start justify-between p-5 border-b border-neutral-800">
                        <div>
                            <h2 className="text-2xl font-bold" style={H}>Bug Hunter</h2>
                            <p className="text-sm text-neutral-400 mt-1">Elimina los bugs del sistema</p>
                        </div>
                        <button onClick={onClose} aria-label="Cerrar" className="h-9 w-9 grid place-items-center border border-neutral-600 hover:bg-white hover:text-black transition-colors"><i className="bi bi-x-lg" /></button>
                    </header>
                    <div className="p-5 md:p-6">
                        <div className="grid grid-cols-3 gap-3 mb-5">
                            {[['Puntos', score], ['Tiempo', time + 's'], ['Récord', high]].map(([l, v], i) => (
                                <div key={l} className={`px-4 py-3 border ${i === 1 ? 'bg-white text-black border-white' : 'border-neutral-700'}`}>
                                    <p className={`text-xs ${i === 1 ? 'text-neutral-600' : 'text-neutral-400'}`}>{l}</p>
                                    <p className="text-2xl font-bold" style={H}>{v}</p>
                                </div>
                            ))}
                        </div>
                        <div className="relative h-64 border border-neutral-700 bg-[#0b0b0b] overflow-hidden game-canvas">
                            {state === 'idle' && (
                                <div className="absolute inset-0 grid place-items-center bg-black/80">
                                    <button onClick={start} className="bg-white text-black px-8 py-3 text-sm font-medium hover:bg-neutral-300 transition-colors">Empezar</button>
                                </div>
                            )}
                            {state === 'over' && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center bg-black/90">
                                    <p className="text-3xl font-bold mb-1" style={H}>Tiempo agotado</p>
                                    <p className="text-neutral-400 text-sm mb-5">Puntuación: {score}</p>
                                    <button onClick={start} className="bg-white text-black px-8 py-3 text-sm font-medium hover:bg-neutral-300 transition-colors">Reintentar</button>
                                </div>
                            )}
                            {state === 'playing' && (
                                <button key={score} aria-label="Bug" onClick={() => { setScore((s) => s + 1); move(); }}
                                    style={{ left: `calc(${pos.x}% - 24px)`, top: `calc(${pos.y}% - 24px)` }}
                                    className="bug-pop absolute h-12 w-12 grid place-items-center bg-white text-black hover:bg-neutral-300">
                                    <i className="bi bi-bug-fill text-xl" />
                                </button>
                            )}
                        </div>
                        <p className="mt-4 text-center text-sm text-neutral-400">Haz clic en el insecto lo más rápido posible.</p>
                    </div>
                </Dialog>
            );
        }

        function App() {
            const [game, setGame] = useState(false);
            const [project, setProject] = useState(null);
            return (
                <>
                    <Header onPlay={() => setGame(true)} />
                    <main>
                        <Hero />
                        <Section id="proyectos" tone="dark" title="Proyectos y laboratorios" intro="Selecciona un monitor para ver el detalle del proyecto.">
                            <Wall onOpen={setProject} />
                        </Section>
                        <Section id="repositorios" title="Repositorios"><Repos /></Section>
                        <Section id="especialidades" tone="mist" title="Especialidades"><Skills /></Section>
                        <Section id="formacion" title="Formación"><Education /></Section>
                        <Section id="idiomas" tone="mist" title="Idiomas"><Languages /></Section>
                        <Section id="preguntas" title="Preguntas frecuentes"><Faq /></Section>
                        <Section id="contacto" tone="dark" title="Contacto"><Contact /></Section>
                    </main>
                    <Footer />
                    <ProjectViewer index={project} onClose={() => setProject(null)} />
                    <Game open={game} onClose={() => setGame(false)} />
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
